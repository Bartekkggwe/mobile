name: Deep Violet - Czytelna analiza, online i cofanie mata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-violet-update-main
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
