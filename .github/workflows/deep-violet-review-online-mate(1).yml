      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version-file: pubspec.yaml
      - name: Dependencies
        run: flutter pub get
      - name: Generate Dart code
        run: dart run build_runner build
      - name: Format changed files
        run: dart format lib/src/model/lobby/game_seek.dart lib/src/model/lobby/lobby_repository.dart lib/src/view/play/quick_game_matrix.dart lib/src/view/play/create_game_widget.dart lib/src/service/create_game_service.dart lib/src/model/offline_computer/offline_computer_game_controller.dart lib/src/view/offline_computer/offline_computer_game_screen.dart lib/src/model/over_the_board/over_the_board_game_controller.dart lib/src/view/over_the_board/over_the_board_screen.dart lib/src/view/game/game_result_dialog.dart lib/src/view/analysis/analysis_screen.dart lib/src/view/analysis/analysis_layout.dart lib/src/view/analysis/local_review_panel.dart lib/src/view/analysis/tree_view.dart
      - name: Analyze changed files
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos lib/src/model/lobby/game_seek.dart lib/src/model/lobby/lobby_repository.dart lib/src/view/play/quick_game_matrix.dart lib/src/view/play/create_game_widget.dart lib/src/service/create_game_service.dart lib/src/model/offline_computer/offline_computer_game_controller.dart lib/src/view/offline_computer/offline_computer_game_screen.dart lib/src/model/over_the_board/over_the_board_game_controller.dart lib/src/view/over_the_board/over_the_board_screen.dart lib/src/view/game/game_result_dialog.dart lib/src/view/analysis/analysis_screen.dart lib/src/view/analysis/analysis_layout.dart lib/src/view/analysis/local_review_panel.dart lib/src/view/analysis/tree_view.dart
      - name: Build Android APK
        run: |
          flutter build apk --debug \
            --dart-define=LICHESS_HOST=lichess.org \
            --dart-define=LICHESS_WS_HOST=socket.lichess.org
      - name: Save changes after successful build
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/model/lobby/game_seek.dart lib/src/model/lobby/lobby_repository.dart lib/src/view/play/quick_game_matrix.dart lib/src/view/play/create_game_widget.dart lib/src/service/create_game_service.dart lib/src/model/offline_computer/offline_computer_game_controller.dart lib/src/view/offline_computer/offline_computer_game_screen.dart lib/src/model/over_the_board/over_the_board_game_controller.dart lib/src/view/over_the_board/over_the_board_screen.dart lib/src/view/game/game_result_dialog.dart lib/src/view/analysis/analysis_screen.dart lib/src/view/analysis/analysis_layout.dart lib/src/view/analysis/local_review_panel.dart lib/src/view/analysis/tree_view.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Improve review UI, Board API pairing and local mate undo'
            git push origin HEAD:main
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deep-Violet-Review-Online-Mate-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
