name: AI Arena - naprawiony instalator do Lichess

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-arena-fix.yml'

permissions:
  contents: write

concurrency:
  group: install-ai-arena-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate_and_build:
    name: Dodaj tryb AI Arena, zbuduj Lichess APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Pobierz nasz Lichess
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Flutter zgodny z projektem
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

