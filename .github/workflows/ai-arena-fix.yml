          import base64, gzip
          from pathlib import Path
          raw = base64.b64decode(Path('/tmp/ai_arena_source.b64').read_text())
          Path('lib/src/view/ai_arena/ai_arena_screen.dart').write_bytes(gzip.decompress(raw))
          path = Path('lib/src/view/more/more_tab_screen.dart')
          content = path.read_text()
          import_line = "import 'package:lichess_mobile/src/view/ai_arena/ai_arena_screen.dart';\n"
          if import_line not in content:
              anchor = "import 'package:lichess_mobile/src/view/more/import_pgn_screen.dart';"
              assert anchor in content, 'Zmienila sie struktura plikow Lichess (import).'
              content = content.replace(anchor, import_line + anchor, 1)
          list_tile = "              ListTile(\n                leading: const Icon(Icons.smart_toy_outlined),\n                trailing: const Icon(Icons.chevron_right),\n                title: const Text('AI Arena'),\n                subtitle: const Text('Ty vs ChatGPT · ChatGPT vs Stockfish'),\n                onTap: () => Navigator.of(context).pushHidingTabBar(\n                  MaterialPageRoute<void>(builder: (_) => const ArenaPage()),\n                ),\n              ),\n"
          if "title: const Text('AI Arena')," not in content:
              anchor = '              ListTile(\n                leading: const Icon(Icons.upload_file_outlined),'
              assert anchor in content, 'Zmienila sie struktura ekranu Wiecej (lista narzedzi).'
              content = content.replace(anchor, list_tile + anchor, 1)
          path.write_text(content)
          PY_SOURCE

      - name: Przygotuj zaleznosci Flutter
        run: flutter pub get

      - name: Formatuj nowe pliki
        run: dart format lib/src/view/ai_arena/ai_arena_screen.dart lib/src/view/more/more_tab_screen.dart

      - name: Generuj wymagane pliki aplikacji
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Zweryfikuj kod AI Arena
        run: dart analyze lib/src/view/ai_arena/ai_arena_screen.dart

      - name: Zbuduj jeden APK Lichess z AI Arena
        run: flutter build apk --debug --dart-define=LICHESS_HOST=lichess.org --dart-define=LICHESS_WS_HOST=socket.lichess.org

      - name: Zachowaj dzialajacy kod AI Arena w repozytorium
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/view/ai_arena/ai_arena_screen.dart lib/src/view/more/more_tab_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "Integrate AI Arena with Stockfish callback support"
            git push origin HEAD:main
          fi

      - name: Udostepnij APK bez ZIP na GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk Lichess-AI-Arena.apk
          if gh release view lichess-ai-arena-v1 >/dev/null 2>&1; then
            gh release upload lichess-ai-arena-v1 Lichess-AI-Arena.apk --clobber
          else
            gh release create lichess-ai-arena-v1 Lichess-AI-Arena.apk --target main --title 'Lichess z AI Arena (Android)' --notes 'Lichess + tryb AI Arena w zakladce Wiecej -> Narzedzia. Tryby: Ty vs ChatGPT, Ty vs Stockfish, ChatGPT vs Stockfish. APK testowe (debug). Tryb GPT wymaga osobnego klucza OpenAI API.'
          fi

      - name: Kopia zapasowa APK w Actions
        uses: actions/upload-artifact@v4
        with:
          name: Lichess-AI-Arena-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
