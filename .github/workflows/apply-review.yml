
name: Install Deep Violet Game Review

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update PGN annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/src/widgets/pgn.dart")
          source = path.read_text(encoding="utf-8")

          changes = [
              (
                  "  final bool shouldShowAnnotations = true,\n\n"
                  "  /// Whether to show comments associated with the moves.",
                  "  final bool shouldShowAnnotations = true,\n\n"
                  "  /// Offline review annotations.\n"
                  "  final Map<UciPath, ({String symbol, Color color})> "
                  "localReviewMarks = const {},\n\n"
                  "  /// Whether to show comments associated with the moves.",
              ),
              (
                  "        shouldShowAnnotations: widget.shouldShowAnnotations,\n"
                  "        shouldShowComments: widget.shouldShowComments,",
                  "        shouldShowAnnotations: widget.shouldShowAnnotations,\n"
                  "        localReviewMarks: widget.localReviewMarks,\n"
                  "        shouldShowComments: widget.shouldShowComments,",
              ),
              (
                  "  bool shouldShowAnnotations,\n\n"
                  "  /// Whether to show comments associated with the moves.",
                  "  bool shouldShowAnnotations,\n\n"
                  "  Map<UciPath, ({String symbol, Color color})> "
                  "localReviewMarks,\n\n"
                  "  /// Whether to show comments associated with the moves.",
              ),
              (
                  "          oldWidget.params.shouldShowAnnotations != "
                  "widget.params.shouldShowAnnotations ||\n"
                  "          oldWidget.params.displayMode != "
                  "widget.params.displayMode,",
                  "          oldWidget.params.shouldShowAnnotations != "
                  "widget.params.shouldShowAnnotations ||\n"
                  "          oldWidget.params.localReviewMarks != "
                  "widget.params.localReviewMarks ||\n"
                  "          oldWidget.params.displayMode != "
                  "widget.params.displayMode,",
              ),
              (
                  "    final moveWithNag =\n"
                  "        san +\n"
                  "        (branch.nags != null && params.shouldShowAnnotations\n"
                  "            ? moveAnnotationChar(branch.nags!)\n"
                  "            : '');\n\n"
                  "    final nag = params.shouldShowAnnotations "
                  "? branch.nags?.firstOrNull : null;",
                  "    final reviewMark = params.localReviewMarks[path];\n"
                  "    final moveWithNag =\n"
                  "        san +\n"
                  "        (reviewMark == null && branch.nags != null "
                  "&& params.shouldShowAnnotations\n"
                  "            ? moveAnnotationChar(branch.nags!)\n"
                  "            : '');\n\n"
                  "    final nag = reviewMark == null && "
                  "params.shouldShowAnnotations\n"
                  "        ? branch.nags?.firstOrNull : null;",
              ),
              (
                  "                          : _textColor(context, "
                  "isCurrentMove ? 1 : 0.9, nag: nag),\n"
                  "                    ),\n"
                  "                  ),\n"
                  "                ],",
                  "                          : _textColor(context, "
                  "isCurrentMove ? 1 : 0.9, nag: nag),\n"
                  "                    ),\n"
                  "                  ),\n"
                  "                  if (reviewMark != null)\n"
                  "                    TextSpan(\n"
                  "                      text: ' ${reviewMark.symbol}',\n"
                  "                      style: moveTextStyle.copyWith(\n"
                  "                        color: reviewMark.color,\n"
                  "                        fontWeight: FontWeight.w900,\n"
                  "                      ),\n"
                  "                    ),\n"
                  "                ],",
              ),
          ]

          if "localReviewMarks = const {}" in source:
              print("PGN review integration already installed.")
          else:
              updated = source

              for index, (old, new) in enumerate(changes, 1):
                  count = updated.count(old)
                  if count != 1:
                      raise RuntimeError(
                          f"Change {index}: expected 1 match, found {count}"
                      )
                  updated = updated.replace(old, new, 1)

              path.write_text(updated, encoding="utf-8")
              print("Installed all six PGN changes.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add lib/src/widgets/pgn.dart
          if ! git diff --cached --quiet; then
            git commit -m "Add Deep Violet move review annotations"
            git push
          else
            echo "No changes needed"
          fi
          
