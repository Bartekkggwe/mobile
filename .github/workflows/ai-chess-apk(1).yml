            sdk: ^3.10.0
          
          dependencies:
            flutter:
              sdk: flutter
            dartchess: ^0.15.0
            multistockfish: ^0.6.1
            http: ^1.6.0
            flutter_secure_storage: ^11.2.0
          
          flutter:
            uses-material-design: true
          APP_PUBSPEC
