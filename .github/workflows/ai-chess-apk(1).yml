name: AI Chess Arena - Android APK

on:
  push:
    paths:
      - .github/workflows/ai-chess-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Generate independent Android application
        shell: bash
        run: |
          flutter create --platforms android --org pl.bartek --project-name ai_chess --no-pub arena
