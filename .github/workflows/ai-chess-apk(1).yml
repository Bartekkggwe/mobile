      - name: Download Flutter dependencies
        run: cd arena && flutter pub get
      - name: Build signed APK
        run: cd arena && flutter build apk --release
      - name: Publish APK as directly downloadable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp arena/build/app/outputs/flutter-apk/app-release.apk AI-Chess-Arena.apk
          if gh release view ai-chess-v1 >/dev/null 2>&1; then
            gh release upload ai-chess-v1 AI-Chess-Arena.apk --clobber
          else
            gh release create ai-chess-v1 AI-Chess-Arena.apk --target "$GITHUB_SHA" --title "AI Chess Arena - Android" --notes "ChatGPT vs Stockfish, Ty vs ChatGPT i Ty vs Stockfish. Nie potrzebujesz rozpakowywać ZIP."
          fi
      - name: Upload APK to Actions as fallback
        uses: actions/upload-artifact@v4
        with:
          name: AI-Chess-Arena-APK
          path: AI-Chess-Arena.apk
          retention-days: 7
